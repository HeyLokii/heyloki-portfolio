<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeyLoki — Model Gallery</title><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="color-scheme" content="dark"><style>:root{--bg:#0e1117;--card:#151a23;--line:#222a36;--ink:#fff;--sub:#aab4c3;--blue:#4e8ce6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
a{color:inherit;text-decoration:none}main{max-width:1320px;margin:0 auto;padding:28px 24px}.brand{display:flex;justify-content:center;padding:44px 0 8px}.brand img{width:min(420px,70vw);height:auto}
h1{font-size:clamp(26px,3.2vw,40px);text-align:center;margin:18px 0 8px;font-weight:700;letter-spacing:.2px}.lead{color:var(--sub);text-align:center;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 14px 34px #000a}
.card .im{overflow:hidden}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .5s}.card:hover img{transform:scale(1.035)}.card .t{text-align:center;padding:18px 16px 22px;margin-top:auto}.card h2{margin:0 0 14px;font-size:21px;font-weight:650}
.btn{display:inline-block;background:linear-gradient(#5d98ec,#4580d6);color:#fff;font-weight:600;font-size:14px;padding:10px 20px;border-radius:10px;border:1px solid #ffffff2a;transition:filter .2s,transform .2s;cursor:pointer}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.dark{background:linear-gradient(#3b4557,#2f3747)}
.top{display:flex;justify-content:center;margin:6px 0 26px}.hero{width:100%;border-radius:16px;display:block;cursor:zoom-in}
section{margin-top:54px}h2.s{font-size:22px;margin:0 0 16px;font-weight:600}
.spec{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--blue);border-radius:14px;overflow:hidden}.spec div{padding:16px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec .w2{grid-column:span 2}.spec .w3{grid-column:span 3}.spec small{display:block;color:var(--sub);font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;margin-bottom:5px}.spec b{font-weight:600;font-size:15.5px}@media(max-width:860px){.spec .w2,.spec .w3{grid-column:auto}.spec{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.spec{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:760px){.three{grid-template-columns:1fr}}.three figure{margin:0}.three .im{overflow:hidden;border-radius:12px}.three img{width:100%;display:block;cursor:zoom-in;aspect-ratio:16/9;object-fit:cover;transition:transform .4s}.three figure:hover img{transform:scale(1.04)}
figcaption{text-align:center;color:var(--sub);padding:9px 0 0;font-weight:600;font-size:14px}
.carousel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.carousel figure{margin:0;display:none}.carousel figure.on{display:block}.carousel .stage{position:relative}.carousel img,.carousel canvas{width:100%;border-radius:10px;display:block;cursor:zoom-in}.carousel canvas{position:absolute;inset:0;height:100%}
.nav{position:absolute;top:44%;transform:translateY(-50%);background:#0e1117cc;border:1px solid #2c3646;color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer;transition:border-color .2s,background .2s}.nav:hover{border-color:var(--blue);background:#0e1117}.nav.l{left:26px}.nav.r{right:26px}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px}.ctl button{background:#1d2430;border:1px solid #2c3646;color:#dfe6f0;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}.ctl button:hover{border-color:var(--blue)}
.dots{display:flex;justify-content:center;gap:8px}.dots span{width:9px;height:9px;border-radius:50%;background:#3a4454;cursor:pointer}.dots span.on{background:var(--blue)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:54px;flex-wrap:wrap}.pager a.mini{color:var(--sub);font-size:14px;padding:8px 4px}.pager a.mini:hover{color:#fff}.pager .mid{flex:1;display:flex;justify-content:center}
.box{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;cursor:zoom-out}.box.on{display:flex}.box img{max-width:94vw;max-height:86vh;border-radius:8px}.box p{color:#cfd6e2;margin:12px 0 0;font-size:14px}
.box .nav{top:50%}.box .nav.l{left:20px}.box .nav.r{right:20px}
footer{color:#6b7686;text-align:center;padding:40px 0 48px;font-size:13px}.preview{background:var(--blue);color:#fff;text-align:center;padding:6px;font-size:13px}</style></head>
<body><div class="brand"><img src="assets/logo-dark.png" alt="HeyLoki"></div><main><h1>Model Gallery</h1><p class="lead">Minecraft Bedrock models, textures and animations.</p><div class="grid"><a class="card" href="brown-bear.html"><div class="im"><img src="models/brown-bear/renders/hero.jpg" alt="Brown Bear" loading="lazy"></div><div class="t"><h2>Brown Bear</h2><span class="btn">Open Model</span></div></a><a class="card" href="reef-shark.html"><div class="im"><img src="models/reef-shark/renders/hero.jpg" alt="Reef Shark" loading="lazy"></div><div class="t"><h2>Reef Shark</h2><span class="btn">Open Model</span></div></a></div></main><footer>© HeyLoki</footer><script src="assets/site.js"></script></body></html>
